spring.application.name=shop-vibe
# 1. API CONFIGURATION
server.servlet.context-path=/api
# 2. DATABASE CONNECTION CONFIGURATION
spring.datasource.url=jdbc:postgresql://localhost:5432/shop_vibe
spring.datasource.username=sa
spring.datasource.password=sapassword
spring.datasource.driver-class-name=org.postgresql.Driver
# 3. JPA / HIBERNATE CONFIGURATION
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#  Hibernate 6 convert  CamelCase to snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.config.import=optional:application-secret.properties
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=sapassword
spring.data.redis.ssl.enabled=false
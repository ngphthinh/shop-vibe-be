spring.application.name=shop-vibe

# 1. API CONFIGURATION
server.servlet.context-path=/api

# 2. DATABASE CONNECTION CONFIGURATION
spring.datasource.url=jdbc:postgresql://db:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. JPA / HIBERNATE CONFIGURATION
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true

# Hibernate 6 convert CamelCase to snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# 4. REDIS CONFIGURATION
spring.data.redis.host=cache
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=false

spring.profiles.active=${SPRING_PROFILES_ACTIVE}

spring.cache.type=redis

jwt.secret-key=${JWT_SECRET}
# 10 hours in seconds
jwt.expiration=${JWT_EXPIRATION}
jwt.refreshable-duration=${JWT_REFRESH_EXPIRATION}

app.default-password=${DEFAULT_PASSWORD}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

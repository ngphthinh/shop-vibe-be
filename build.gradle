plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'


    // Thêm plugin cho code coverage và SonarQube
    id 'jacoco'
    id 'org.sonarqube' version '5.0.0.4638' // Cập nhật version mới nhất nếu cần
}

group = 'org.ngphthinh'
version = '0.0.1-SNAPSHOT'
description = 'shop-vibe'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Core & Web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Databases (SQL & NoSQL)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // Đã bao gồm Hibernate
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    runtimeOnly 'org.postgresql:postgresql'

    // Swagger UI / OpenAPI Docs
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'

    // Lombok (Giúp generate Getter/Setter)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing (Chỉ cần 2 dòng này là cân được hết các loại test)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Lombok cho Test nếu bạn viết code test có dùng @Builder, @Getter...
//	testCompileOnly 'org.projectlombok:lombok'
//	testAnnotationProcessor 'org.projectlombok:lombok'
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
    // --- MAPSTRUCT ---
    implementation 'org.mapstruct:mapstruct:1.6.0.Beta1' // Hoặc phiên bản stable bạn đang dùng
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.0.Beta1'

    // --- LOMBOK MAPSTRUCT BINDING (Cực kỳ quan trọng) ---
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'


    //JWT
    implementation 'com.nimbusds:nimbus-jose-jwt:9.48'

    // Spring Security
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // Fake data generator
    implementation 'net.datafaker:datafaker:2.2.2'

    // Cloudinary
    implementation("com.cloudinary:cloudinary-http44:1.34.0")

}
compileJava {
    options.compilerArgs = [
            '-Amapstruct.defaultComponentModel=spring'
    ]

}
tasks.withType(JavaCompile) {
    options.compilerArgs += '-parameters'
}
tasks.named('test') {
    useJUnitPlatform()
}

// --- Cấu hình cho JaCoCo (Công cụ đo Coverage) ---
jacocoTestReport {
    dependsOn test // Đảm bảo test phải chạy xong thì mới tạo báo cáo

    reports {
        xml.required = true  // Bắt buộc bật XML vì SonarQube chỉ đọc file XML
        csv.required = false
        html.required = true // Bật HTML để bạn có thể tự mở trình duyệt xem local nếu muốn
    }
}

// Đảm bảo mỗi khi bạn gõ lệnh `./gradlew test` là nó tự sinh kèm report JaCoCo
test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

// --- Cấu hình cho SonarQube (Công cụ quét Code Quality) ---
sonar {
    properties {
        // 1. Thông tin kết nối Server SonarQube
        property "sonar.host.url", "http://localhost:9000"
        property "sonar.token", "chuoi_token_cua_ban" // Điền token bạn tạo trên giao diện SonarQube

        // 2. Định danh dự án trên Dashboard SonarQube
        property "sonar.projectName", "shopvibe-backend"
        property "sonar.projectKey", "shopvibe-backend-key"

        // 3. Đường dẫn trỏ tới file báo cáo của JaCoCo để SonarQube đọc % Coverage
        // Cách viết này tương thích tốt với mọi phiên bản Gradle (kể cả Gradle 8+)
        property "sonar.coverage.jacoco.xmlReportPaths", "${layout.buildDirectory.get().asFile}/reports/jacoco/test/jacocoTestReport.xml"

        // 4. Loại bỏ (Exclude) những file không muốn quét
        // Thường chúng ta sẽ bỏ qua các file cấu hình, entity, hoặc dto vì chúng không chứa logic nghiệp vụ
        property "sonar.exclusions", [
                "**/dto/**",
                "**/entity/**",
                "**/mapper/**",
                "**/config/**",
                "**/*Application.java"
        ].join(",")

        // 5. Nếu bạn muốn loại bỏ riêng phần tính % Test Coverage cho một số file
        // (Vẫn quét lỗi bảo mật nhưng không bắt buộc phải viết Unit Test cho chúng)
        property "sonar.coverage.exclusions", [
                "**/exception/**",
                "**/util/**"
        ].join(",")
    }
}